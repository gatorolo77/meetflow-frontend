<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <!-- Header with Distinct Context Title -->
    <div class="modal-header">
      <!-- Create Room Context Header -->
      <div class="header-title-block" *ngIf="activeTab === 'CREATE'">
        <div class="modal-icon-badge icon-teal">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        </div>
        <div>
          <h2 class="modal-title">Crear Nueva Sala de Reunión</h2>
          <p class="modal-subtitle">Configura los datos de tu sesión e inicia la sala instantáneamente.</p>
        </div>
      </div>

      <!-- Join Room Context Header -->
      <div class="header-title-block" *ngIf="activeTab === 'JOIN'">
        <div class="modal-icon-badge icon-leather">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        </div>
        <div>
          <h2 class="modal-title">Unirse a una Reunión</h2>
          <p class="modal-subtitle">Ingresa el código o enlace compartido para solicitar ingreso a la sala.</p>
        </div>
      </div>

      <button class="close-btn" (click)="onClose()" title="Cerrar modal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="modal-tabs">
      <button [class.active]="activeTab === 'CREATE'" (click)="activeTab = 'CREATE'">
        <span>+ Nueva Sala</span>
      </button>
      <button [class.active]="activeTab === 'JOIN'" (click)="activeTab = 'JOIN'">
        <span>🔗 Unirse con Código</span>
      </button>
    </div>

    <!-- Body: CREATE ROOM FORM -->
    <div class="modal-body" *ngIf="activeTab === 'CREATE'">
      <div class="form-group">
        <label for="title">Nombre de la reunión</label>
        <input id="title" type="text" [(ngModel)]="titleInput" placeholder="Ej. Sync Diario de Desarrollo">
      </div>

      <div class="form-group">
        <label for="team">Equipo u Organización</label>
        <input id="team" type="text" [(ngModel)]="teamInput" placeholder="Ej. Equipo de Producto & UX">
      </div>

      <!-- Quick Room Security Options -->
      <div class="options-box">
        <span class="options-label">Opciones de la Sala:</span>
        <label class="checkbox-option">
          <input type="checkbox" [(ngModel)]="enableWaitingRoom">
          <span>Habilitar sala de espera (Aprobación manual del anfitrión)</span>
        </label>
        <label class="checkbox-option">
          <input type="checkbox" [(ngModel)]="startWithMic">
          <span>Iniciar con micrófono activo</span>
        </label>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline" (click)="onClose()">Cancelar</button>
        <button class="btn btn-primary btn-submit-create" (click)="onCreateMeeting()">
          <span>Iniciar Sala Instantánea</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- Body: JOIN ROOM FORM -->
    <div class="modal-body" *ngIf="activeTab === 'JOIN'">
      <div class="form-group">
        <label for="code">Código o enlace de la reunión</label>
        <input 
          id="code" 
          type="text" 
          [(ngModel)]="codeInput" 
          placeholder="Ej. m-101 o https://meetflow.app/meetings/m-101"
          (keyup.enter)="onJoinMeeting()">
      </div>

      <!-- Pre-flight Hardware Check Toggles -->
      <div class="preflight-box">
        <span class="options-label">Ajustes antes de ingresar:</span>
        <div class="preflight-buttons">
          <button 
            type="button"
            class="toggle-btn" 
            [class.active]="joinWithMic" 
            (click)="joinWithMic = !joinWithMic">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            </svg>
            <span>Micrófono: {{ joinWithMic ? 'Encendido' : 'Silenciado' }}</span>
          </button>

          <button 
            type="button"
            class="toggle-btn" 
            [class.active]="joinWithCam" 
            (click)="joinWithCam = !joinWithCam">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            <span>Cámara: {{ joinWithCam ? 'Encendida' : 'Apagada' }}</span>
          </button>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline" (click)="onClose()">Cancelar</button>
        <button 
          class="btn btn-leather btn-submit-join" 
          (click)="onJoinMeeting()" 
          [disabled]="!codeInput.trim()">
          <span>Solicitar Ingreso a la Sala</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
