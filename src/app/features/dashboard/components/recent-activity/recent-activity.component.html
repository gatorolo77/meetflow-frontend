<section class="card activity-card">
  <h2 class="section-title">Actividad reciente</h2>

  <div class="activity-list">
    <div class="activity-item" *ngFor="let item of activities">
      <div class="activity-icon" [ngClass]="item.iconType">
        <!-- Check Icon -->
        <svg *ngIf="item.iconType === 'check-circle'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>

        <!-- Video Icon -->
        <svg *ngIf="item.iconType === 'video'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>

        <!-- User Check Icon -->
        <svg *ngIf="item.iconType === 'user-check'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <polyline points="17 11 19 13 23 9"></polyline>
        </svg>

        <!-- Message Icon -->
        <svg *ngIf="item.iconType === 'message-square'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </div>

      <span class="activity-desc">{{ item.description }}</span>
      <span class="activity-time">{{ item.timestampRelative }}</span>
    </div>
  </div>
</section>
