<section class="dashboard-hero-bar card">
  <div class="hero-left">
    <div class="hero-title-row">
      <h1 class="hero-title">Bienvenido, {{ userName }}</h1>
      <span class="status-pill">
        <span class="live-dot"></span> Operativo
      </span>
    </div>
    <p class="hero-subtitle">Gestiona tus reuniones, aprueba accesos y colabora en tiempo real.</p>
  </div>


  <div class="hero-right" style="display: flex; gap: 10px; align-items: center;">
    <button class="btn btn-leather hero-btn" (click)="onOutreach()" title="Subir lista CSV y agendar con invitaciones por mail">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
      </svg>
      <span>Enviar Invitaciones</span>
    </button>

    <button class="btn btn-primary hero-btn btn-new" (click)="onNewMeeting()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="3" ry="3"></rect>
      </svg>
      <span>Nueva reunión</span>
    </button>
  </div>
</section>
