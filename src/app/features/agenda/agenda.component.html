<div class="page-container">
  <!-- Agenda Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Agenda de Reuniones</h1>
      <p class="page-subtitle">Gestiona tu calendario, reuniones agendadas y exporta tu agenda.</p>
    </div>

    <div class="header-actions-group">
      <button class="btn btn-outline-pdf" (click)="downloadPdf()" title="Descargar agenda en PDF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <polyline points="9 15 12 18 15 15"></polyline>
        </svg>
        <span>Descargar PDF</span>
      </button>

      <button class="btn btn-outline-danger" (click)="openClearModal()" title="Limpiar y borrar todas las reuniones de la agenda">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>Limpiar Agenda</span>
      </button>

      <button class="btn btn-primary" routerLink="/dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Programar Nueva Reunión</span>
      </button>
    </div>
  </div>

  <!-- Upcoming Meetings List Section -->
  <app-upcoming-meetings 
    [meetings]="(upcomingMeetings$ | async) || []"
    (delete)="onDeleteMeeting($event)">
  </app-upcoming-meetings>
</div>

<!-- Modal de Confirmación para Limpiar Agenda -->
<div class="clear-modal-backdrop" *ngIf="showClearModal">
  <div class="clear-modal-card">
    <div class="clear-modal-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>
    <h3 class="clear-modal-title">¿Limpiar toda la agenda?</h3>
    <p class="clear-modal-desc">
      Se borrarán todas las reuniones agendadas actualmente de tu calendario. Te recomendamos descargar el reporte en PDF antes de limpiar.
    </p>

    <div class="clear-modal-actions">
      <button class="btn btn-modal-pdf" (click)="downloadPdfAndClear()">
        📄 Descargar PDF y Limpiar
      </button>
      <button class="btn btn-modal-danger" (click)="confirmClearAgenda()">
        🗑️ Solo Limpiar
      </button>
      <button class="btn btn-modal-cancel" (click)="closeClearModal()">
        Cancelar
      </button>
    </div>
  </div>
</div>
